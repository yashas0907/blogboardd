name: Scheduled Article Generation

on:
  # Every 6 hours (00:30, 06:30, 12:30, 18:30 UTC) = 4 articles/day
  schedule:
    - cron: "30 0,6,12,18 * * *"
  workflow_dispatch: {}

# contents:write so the bot can push generated articles.
# pages/id-token so this workflow can deploy the site DIRECTLY - pushes made
# with the internal GITHUB_TOKEN do not trigger other workflows, so the site
# must be deployed from here rather than relying on the push event.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Needed BEFORE the generation step: the error handler commits the
      # error log on failure, and git commit requires an identity.
      - name: Configure git identity
        run: |
          git config user.name  "yashas0907"
          git config user.email "yashas0907@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Determine track (rotates through all domains)
        id: track
        run: |
          # 7 domains, one per 6-hour slot. Full rotation every 42 hours.
          DOMAINS=(ml dl statistics nlp cv genai ainews)
          SLOT=$(( $(date +%s) / 21600 ))   # 6-hour slots since epoch
          DOMAIN=${DOMAINS[$(( SLOT % 7 ))]}
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Slot $SLOT -> generating for '$DOMAIN'"

      - name: Run generation pipeline
        env:
          LLM__API_KEY: ${{ secrets.LLM_API_KEY }}
          STORAGE_BACKEND: local
          LOCAL_STORAGE_ROOT: neurapress/web
          CONTENT__TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CONTENT__GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          CONTENT__UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -o pipefail
          DOMAIN=${{ steps.track.outputs.domain }}
          if [ "$DOMAIN" = "ainews" ]; then
            CMD="uv run python -m neurapress.run --ainews"
          else
            CMD="uv run python -m neurapress.run --domain $DOMAIN"
          fi
          if ! $CMD 2>&1 | tee gen_output.log; then
            # Persist the failure via the GitHub contents API — no git
            # operations, immune to -e aborts and push races. The log is
            # then publicly readable without authenticated access.
            {
              echo "Generation failed at $(date -u +%Y-%m-%dT%H:%M:%SZ) for domain: $DOMAIN"
              echo "--- last 80 lines of output ---"
              tail -80 gen_output.log
            } > generation-error.log || true
            B64=$(base64 -w0 generation-error.log || true)
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/generation-error.log" \
              -d "{\"message\":\"ci: capture generation error log\",\"content\":\"$B64\"}" || true
            echo "## Generation failed for domain: $DOMAIN" >> "$GITHUB_STEP_SUMMARY" || true
            tail -30 gen_output.log >> "$GITHUB_STEP_SUMMARY" || true
            exit 1
          fi
          rm -f gen_output.log

      - name: Commit generated article
        id: publish
        run: |
          git config user.name  "yashas0907"
          git config user.email "yashas0907@users.noreply.github.com"
          git add neurapress/web/blogs neurapress/web/rss.xml neurapress/web/sitemap.xml neurapress/web/js/site-data.js
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new article."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: scheduled article"
            git pull --rebase origin main
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Verify AFTER publishing: a verify failure must never discard a
      # freshly generated article — it only flags the run for inspection.
      - name: Verify site integrity
        run: |
          set -o pipefail
          if ! uv run python scripts/verify_site.py 2>&1 | tee verify_output.log; then
            {
              echo "Site verify failed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "--- last 60 lines ---"
              tail -60 verify_output.log
            } > verify-error.log || true
            B64=$(base64 -w0 verify-error.log || true)
            curl -s -X PUT \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/verify-error.log" \
              -d "{\"message\":\"ci: capture site verify error\",\"content\":\"$B64\"}" || true
            exit 1
          fi
          rm -f verify_output.log

  # Deploy the site DIRECTLY (cannot rely on the push event: bot pushes use
  # GITHUB_TOKEN, which does not trigger other workflows).
  deploy:
    needs: generate
    if: needs.generate.outputs.published == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: neurapress/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
