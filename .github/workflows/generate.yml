name: Scheduled Article Generation

on:
  # 8:00 AM IST = 02:30 UTC — matches the published schedule
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Determine track (weekday → domain)
        id: track
        run: |
          # Mon=ml Tue=dl Wed=statistics Thu=nlp Fri=cv Sat=genai Sun=ainews
          declare -A SCHEDULE=( [1]=ml [2]=dl [3]=statistics [4]=nlp [5]=cv [6]=genai [7]=ainews )
          DOW=$(date +%u)
          DOMAIN=${SCHEDULE[$DOW]}
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Today is day $DOW → generating for '$DOMAIN'"

      - name: Run generation pipeline
        env:
          LLM__API_KEY: ${{ secrets.LLM_API_KEY }}
          STORAGE_BACKEND: local
          LOCAL_STORAGE_ROOT: blogboard/web
          CONTENT__TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CONTENT__GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          CONTENT__UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          R2__ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2__ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2__SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2__BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          DOMAIN=${{ steps.track.outputs.domain }}
          if [ "$DOMAIN" = "ainews" ]; then
            uv run python -m blogboard.run --ainews
          else
            uv run python -m blogboard.run --domain "$DOMAIN"
          fi

      - name: Verify site integrity
        run: uv run python scripts/verify_site.py
        env:
          STORAGE_BACKEND: local

      - name: Commit generated article
        run: |
          git config user.name  "blogboard-bot"
          git config user.email "actions@github.com"
          git add blogboard/web/blogs blogboard/web/rss.xml blogboard/web/sitemap.xml blogboard/web/js/site-data.js
          git diff --cached --quiet || git commit -m "chore: scheduled article [skip ci]"
          git push
