name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          STORAGE_BACKEND: local

      - name: Build site (self-heal + bake site-data.js)
        run: uv run python scripts/build_site.py
        env:
          STORAGE_BACKEND: local

      - name: Verify site integrity
        run: uv run python scripts/verify_site.py
        env:
          STORAGE_BACKEND: local

      - name: Dry-run pipeline (no keys needed)
        run: uv run python -m blogboard.run --dry-run
        env:
          STORAGE_BACKEND: local

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Compile all Python files (syntax check)
        run: uv run python -m compileall blogboard
