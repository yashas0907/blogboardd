[project]
name = "blogboard"
version = "0.2.0"
description = "BlogBoard — autonomous multi-agent AI blog generator (LangGraph + Groq)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.42.65",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "langchain-core>=1.2.16",
    "langchain-groq>=1.1.2",
    "langgraph>=1.0.10",
    "opik",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.0",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# BLE001 (blind except) — the pipeline intentionally catches broad
# exceptions so one failed publish never kills the whole run.
# E501 long lines — prompts and print strings regularly exceed limits.
# E402 late imports — run.py must load .env before importing the app;
#   test_build_site.py must set sys.path before importing scripts.
ignore = ["BLE001", "E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
